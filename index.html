<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Juego web de inglés para 1° básico: Unidad 6 My House (habitaciones, objetos y acciones).">
<title>My House Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: a picture-book apartment building. The roof holds the title, each window is an activity,
   the front door opens the explorable house. Single bright "storybook" theme on purpose (kids' book look). */
:root {
  --crimson: #C42341;
  --crimson-deep: #8F1430;
  --dot: #E8627F;
  --sky: #D8EEF6;
  --brick: #F3BAC6;
  --ink: #2A2233;
  --ink-soft: #5D5368;
  --paper: #FFFFFF;
  --butter: #FFD25C;
  --grass: #6DBE6A;
  --door: #3E8FC6;
  --ok: #23905A;
  --ok-bg: #DDF5E6;
  --no: #D2412F;
  --no-bg: #FDE3DE;

  --room-living: #FFD97A;
  --room-kitchen: #9DC9F2;
  --room-bathroom: #BCE6E1;
  --room-bedroom: #B7E1B0;
  --room-dining: #F7A9BD;
  --room-balcony: #F7C59C;
  --room-garden: #A7DA8F;
  --room-door: #CFE3F5;

  --f-display: 'Grandstander', 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif;
  --f-body: 'Andika', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --f-emoji: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif;

  --r-lg: 22px;
  --r-md: 14px;
  color-scheme: light;
}
html, body { background: var(--sky); color: var(--ink); }
body { font-family: var(--f-body); font-size: 17px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 4px solid var(--butter); outline-offset: 3px; border-radius: 10px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.1; text-wrap: balance; margin: 0; }

/* ---------- Top bar ---------- */
.topbar {
  background: var(--crimson) radial-gradient(var(--dot) 2.4px, transparent 3px) 0 0 / 18px 18px;
  color: #fff;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.topbar-in { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 6px; font-family: var(--f-display); font-weight: 800; font-size: 20px; color: #fff; }
.brand svg { width: 30px; height: 30px; }
.spacer { flex: 1; }
.pill-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 12px;
  border-radius: 999px; border: 2px solid rgba(255,255,255,.85); background: rgba(255,255,255,.14); color: #fff;
  font-weight: 700; font-size: 15px;
}
.pill-btn[aria-pressed="true"] { background: #fff; color: var(--crimson-deep); }
.star-total { font-family: var(--f-display); font-weight: 800; font-size: 17px; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.18); font-variant-numeric: tabular-nums; }
.emoji { font-family: var(--f-emoji); line-height: 1; }

.wrap {
  max-width: 1040px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
}

/* ---------- Home: the building ---------- */
.home-intro { text-align: center; margin: 4px auto 14px; max-width: 60ch; color: var(--ink-soft); }
.building { max-width: 760px; margin: 0 auto; filter: drop-shadow(0 10px 0 rgba(42,34,51,.12)); }
.roof {
  position: relative; height: 128px;
  background: var(--crimson) radial-gradient(var(--dot) 2.6px, transparent 3.2px) 0 0 / 20px 20px;
  clip-path: polygon(0 100%, 10% 0, 90% 0, 100% 100%);
  display: grid; place-items: center;
}
.roof-sign {
  background: #FCE4EA; color: var(--crimson); border: 4px solid var(--crimson-deep);
  border-radius: 999px; padding: 6px 26px 8px; text-align: center;
}
.roof-sign small { display: block; font-family: var(--f-body); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--crimson-deep); }
.roof-sign h1 { font-size: clamp(30px, 6vw, 46px); font-weight: 800; letter-spacing: .02em; }
.facade {
  background:
    repeating-linear-gradient(0deg, transparent 0 26px, rgba(143,20,48,.10) 26px 28px),
    var(--brick);
  border-inline: 6px solid var(--crimson-deep);
  padding: 20px 18px;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;
}
.win {
  display: flex; flex-direction: column; text-align: left; padding: 0; overflow: hidden;
  background: var(--paper); border: 3px solid var(--ink); border-radius: var(--r-md);
  transition: transform .15s ease;
}
.win:hover { transform: translateY(-3px) rotate(-.6deg); }
.win-glass {
  position: relative; aspect-ratio: 16 / 10; display: grid; place-items: center;
  background: linear-gradient(160deg, #EAF7FD 0 55%, #CBE8F6 55%);
  border-bottom: 3px solid var(--ink);
  font-size: clamp(34px, 7vw, 52px);
}
.win-glass::before, .win-glass::after { content: ""; position: absolute; background: var(--ink); opacity: .85; }
.win-glass::before { left: 50%; top: 0; bottom: 0; width: 3px; transform: translateX(-50%); }
.win-glass::after { top: 50%; left: 0; right: 0; height: 3px; transform: translateY(-50%); }
.win-glass .emoji { position: relative; z-index: 1; background: #fff; border: 3px solid var(--ink); border-radius: 50%; width: 1.7em; height: 1.7em; display: grid; place-items: center; font-size: .72em; }
.win-tag { position: absolute; z-index: 2; top: 6px; left: 6px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--butter); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 8px; }
.win-body { padding: 8px 10px 10px; display: grid; gap: 2px; }
.win-title { font-family: var(--f-display); font-weight: 800; font-size: 17px; line-height: 1.1; }
.win-sub { font-size: 14px; color: var(--ink-soft); line-height: 1.25; }
.stars { display: flex; gap: 2px; font-size: 18px; margin-top: 4px; }
.stars .off { filter: grayscale(1); opacity: .28; }

.ground {
  position: relative; background: var(--brick); border-inline: 6px solid var(--crimson-deep);
  display: grid; place-items: center; padding: 0 18px;
}
.door-btn {
  display: grid; justify-items: center; gap: 4px; width: min(260px, 70%);
  background: var(--door); color: #fff; border: 4px solid var(--ink); border-bottom: 0;
  border-radius: 120px 120px 0 0; padding: 26px 16px 22px; position: relative;
  box-shadow: inset 0 0 0 8px rgba(255,255,255,.18);
}
.door-btn::after { content: ""; position: absolute; right: 22px; top: 54%; width: 14px; height: 14px; border-radius: 50%; background: var(--butter); border: 3px solid var(--ink); }
.door-btn .emoji { font-size: 40px; }
.door-btn strong { font-family: var(--f-display); font-weight: 800; font-size: 22px; }
.door-btn span.sub { font-size: 14px; opacity: .95; }
.door-hint { position: absolute; left: 18px; top: 14px; background: var(--butter); border: 3px solid var(--ink); border-radius: 12px; padding: 4px 10px; font-weight: 700; font-size: 14px; transform: rotate(-4deg); }
.lawn { height: 34px; background: var(--grass); border-top: 4px solid var(--ink); border-radius: 0 0 18px 18px;
  background-image: radial-gradient(circle at 10px 0, #4E9E4C 6px, transparent 7px); background-size: 26px 20px; }

.family { max-width: 760px; margin: 34px auto 0; display: grid; gap: 14px; }
.family h2 { font-size: 22px; }
.family p { margin: 0; color: var(--ink-soft); max-width: 65ch; }
.vocab-group { display: grid; gap: 8px; }
.vocab-group h3 { font-size: 15px; font-family: var(--f-body); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--crimson-deep); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px 4px 6px; font-size: 15px; font-weight: 700; }
.chip .pic { width: 26px; height: 26px; font-size: 20px; }
.notice { background: var(--no-bg); border: 2px solid var(--no); border-radius: var(--r-md); padding: 10px 14px; max-width: 760px; margin: 0 auto 14px; }

/* ---------- Pictures ---------- */
.pic { display: inline-grid; place-items: center; font-family: var(--f-emoji); line-height: 1; min-width: 1.25em; height: 1.25em; white-space: nowrap; }
.pic.is-svg { width: 1.25em; }
.pic svg { width: 100%; height: 100%; display: block; }
.room-mini { display: grid; place-items: center; border-radius: 12px; border: 3px solid var(--ink);
  background: linear-gradient(to top, rgba(120,72,40,.20) 0 26%, transparent 26%), var(--wall);
  font-family: var(--f-emoji); }
.room-mini .objs { display: flex; gap: 2px; align-items: flex-end; }
.opt .room-mini .pic, .drag-item .room-mini .pic { font-size: inherit; }

/* ---------- Activity shell ---------- */
.act-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 700; min-height: 44px; }
.act-title { font-size: clamp(24px, 4vw, 32px); font-weight: 800; }
.progress { display: flex; gap: 6px; margin-left: auto; }
.progress i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); }
.progress i.done { background: var(--ok); }
.progress i.now { background: var(--butter); }
.instr { display: flex; align-items: center; gap: 12px; background: var(--paper); border: 3px solid var(--ink); border-radius: var(--r-lg); padding: 10px 14px; margin-bottom: 14px; }
.instr-num { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--crimson); color: #fff; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 22px; }
.instr-text { min-width: 0; }
.instr-text strong { display: block; font-family: var(--f-display); font-size: 19px; }
.instr-text span { color: var(--ink-soft); font-size: 15px; }
.say-btn { flex: none; margin-left: auto; width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--ink); background: var(--butter); font-size: 22px; display: grid; place-items: center; }
.stage { background: var(--paper); border: 3px solid var(--ink); border-radius: var(--r-lg); padding: clamp(14px, 3vw, 24px); }

/* ---------- Choice games ---------- */
.prompt-row { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 18px; text-align: center; }
.listen-big { display: inline-flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 22px; background: var(--crimson); color: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 12px 24px; box-shadow: 0 5px 0 var(--crimson-deep); }
.listen-big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--crimson-deep); }
.prompt-pic { font-size: 74px; }
.prompt-q { font-family: var(--f-display); font-size: 24px; font-weight: 800; }
.options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.opt { display: grid; justify-items: center; align-content: center; gap: 8px; min-height: 150px; padding: 12px 8px; background: var(--paper); border: 3px solid var(--ink); border-radius: var(--r-lg); transition: transform .12s ease; }
.opt:hover { transform: translateY(-2px); }
.opt .pic { font-size: clamp(54px, 10vw, 76px); }
.opt .room-mini { width: 100%; max-width: 150px; aspect-ratio: 4 / 3; font-size: clamp(26px, 5vw, 38px); }
.opt .word { font-family: var(--f-display); font-weight: 800; font-size: 18px; min-height: 1.3em; }
.opt .word.hidden { visibility: hidden; }
.opt.right { background: var(--ok-bg); border-color: var(--ok); }
.opt.wrong { background: var(--no-bg); border-color: var(--no); }

/* ---------- Drag & drop ---------- */
.dnd-help { font-size: 14px; color: var(--ink-soft); margin: 0 0 10px; }
.tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 14px; min-height: 96px; border: 3px dashed var(--ink-soft); border-radius: var(--r-lg); background: #F3F7FA; margin-bottom: 18px; }
.tray-empty { align-self: center; color: var(--ink-soft); font-weight: 700; }
.drag-item {
  touch-action: none; user-select: none; -webkit-user-select: none;
  display: inline-grid; justify-items: center; gap: 2px; padding: 8px 12px; min-width: 86px;
  background: var(--paper); border: 3px solid var(--ink); border-radius: var(--r-md);
  box-shadow: 0 4px 0 rgba(42,34,51,.25); cursor: grab;
}
.drag-item .pic { font-size: 40px; }
.drag-item .lbl { font-weight: 700; font-size: 15px; white-space: nowrap; }
.drag-item.is-selected { background: #FFF4CC; border-color: var(--crimson); box-shadow: 0 0 0 4px var(--butter); }
.drag-item.is-lifted { opacity: .25; }
.drag-item.letter { min-width: 64px; font-family: var(--f-display); font-weight: 800; font-size: 38px; padding: 6px 14px; }
.drag-item.word { font-family: var(--f-display); font-weight: 800; font-size: 20px; grid-auto-flow: column; align-items: center; gap: 8px; }
.drag-item.word .room-mini { width: 40px; height: 32px; font-size: 14px; border-width: 2px; border-radius: 8px; }
.ghost { position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; margin: 0; box-shadow: 0 14px 24px rgba(42,34,51,.3); }

.zones { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.zone {
  display: flex; flex-direction: column; min-height: 210px; border: 3px solid var(--ink); border-radius: var(--r-lg); overflow: hidden;
  background: linear-gradient(to top, rgba(120,72,40,.18) 0 30%, transparent 30%), var(--wall);
  transition: transform .12s ease, box-shadow .12s ease;
}
.zone-head { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; background: rgba(255,255,255,.7); border-bottom: 3px solid var(--ink); font-family: var(--f-display); font-weight: 800; font-size: 18px; }
.zone-items { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: 6px; padding: 10px; }
.zone.is-target { box-shadow: 0 0 0 4px var(--butter); }
.zone.is-over { transform: scale(1.03); box-shadow: 0 0 0 6px var(--crimson); }
.placed { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.92); border: 2px solid var(--ok); border-radius: 999px; padding: 2px 10px 2px 4px; font-weight: 700; font-size: 14px; animation: pop .35s ease; }
.placed .pic { font-size: 22px; }

.sentence { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: clamp(22px, 4.4vw, 34px); margin: 8px 0 22px; }
.blank { min-width: 7ch; min-height: 1.6em; display: inline-grid; place-items: center; border: 3px dashed var(--crimson); border-radius: 12px; background: #FFF6F8; padding: 2px 12px; color: var(--crimson); }
.blank.filled { border-style: solid; border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.blank.is-target { box-shadow: 0 0 0 4px var(--butter); }
.blank.is-over { box-shadow: 0 0 0 6px var(--crimson); transform: scale(1.04); }
.letters { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 6px 0 22px; }
.letter-box { width: 1.25em; height: 1.5em; display: grid; place-items: center; border-bottom: 4px solid var(--ink); font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 6vw, 46px); }
.letter-box.space { border-bottom-color: transparent; width: .6em; }
.letter-box.blank { min-width: 0; width: 1.25em; border: 3px dashed var(--crimson); border-radius: 10px; padding: 0; }
.letter-box.blank.filled { border-style: solid; }

/* ---------- House (explore + Cloud) ---------- */
.explore { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.house { max-width: 560px; width: 100%; margin: 0 auto; }
.house-roof { height: 70px; background: var(--crimson) radial-gradient(var(--dot) 2.4px, transparent 3px) 0 0 / 16px 16px; clip-path: polygon(0 100%, 12% 0, 88% 0, 100% 100%); }
.house-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; padding: 5px; background: var(--ink); }
.room {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px;
  aspect-ratio: 1 / .92; padding: 8px 4px; border: 0; border-radius: 4px;
  background: linear-gradient(to top, rgba(120,72,40,.20) 0 24%, transparent 24%), var(--wall);
  transition: filter .12s ease, transform .12s ease;
}
.room:hover { filter: brightness(1.05); }
.room.balcony { background: repeating-linear-gradient(90deg, transparent 0 12px, rgba(42,34,51,.55) 12px 15px) bottom / 100% 30% no-repeat, var(--wall); }
.room.span2 { grid-column: span 2; aspect-ratio: auto; }
.room.span3 { grid-column: span 3; aspect-ratio: auto; min-height: 90px; }
.room-objs { font-family: var(--f-emoji); font-size: clamp(22px, 5vw, 34px); display: flex; gap: 2px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
.room-label { background: #fff; border: 2px solid var(--crimson); color: var(--crimson-deep); border-radius: 999px; padding: 0 10px 2px; font-family: var(--f-display); font-weight: 800; font-size: clamp(12px, 2.4vw, 16px); white-space: nowrap; }
.room.is-active { outline: 5px solid var(--butter); outline-offset: -5px; z-index: 1; }
.room .seen { position: absolute; top: 5px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.room.right { outline: 5px solid var(--ok); outline-offset: -5px; }
.house-ground { height: 22px; background: var(--grass); border-radius: 0 0 14px 14px; }
.cat { position: absolute; top: 8px; left: 50%; font-family: var(--f-emoji); font-size: clamp(34px, 7vw, 52px); transform: translateX(-50%); animation: pop .4s ease; }

.panel { background: var(--paper); border: 3px solid var(--ink); border-radius: var(--r-lg); overflow: hidden; }
.panel-band { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 3px solid var(--ink); background: linear-gradient(to top, rgba(120,72,40,.18) 0 22%, transparent 22%), var(--wall); }
.panel-band h2 { font-size: clamp(26px, 4vw, 34px); font-weight: 800; }
.panel-band .es { font-size: 15px; color: var(--ink-soft); font-weight: 700; }
.panel-body { padding: 14px 16px 18px; display: grid; gap: 14px; }
.panel-body h3 { font-family: var(--f-body); font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--crimson-deep); }
.thing-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.thing { display: grid; justify-items: center; gap: 4px; padding: 8px 4px; border: 2px solid var(--ink); border-radius: var(--r-md); background: var(--paper); }
.thing .pic { font-size: 40px; }
.thing b { font-size: 16px; }
.thing small { font-size: 12px; color: var(--ink-soft); }
.say-line { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 12px; border: 2px solid var(--ink); border-radius: var(--r-md); background: #F7FAFC; }
.say-line .pic { font-size: 30px; }
.say-line .pic.multi { width: auto; }
.say-line b { font-size: 17px; }
.say-line small { display: block; color: var(--ink-soft); font-size: 13px; }
.say-line .spk { margin-left: auto; font-family: var(--f-emoji); }
.tapped { animation: pop .3s ease; }

/* ---------- Win overlay ---------- */
.overlay { position: fixed; inset: 0; z-index: 900; display: grid; place-items: center; background: rgba(42,34,51,.55);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.win-card { width: min(440px, 100%); background: var(--paper); border: 4px solid var(--ink); border-radius: 28px; padding: 24px 20px; text-align: center; display: grid; gap: 12px; animation: pop .45s ease; }
.win-card h2 { font-size: 36px; color: var(--crimson); }
.big-stars { display: flex; justify-content: center; gap: 8px; font-size: 54px; font-family: var(--f-emoji); }
.big-stars span { animation: pop .5s ease both; }
.big-stars .off { filter: grayscale(1); opacity: .25; }
.win-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn { min-height: 48px; padding: 8px 18px; border-radius: 999px; border: 3px solid var(--ink); background: var(--paper); font-weight: 700; font-size: 16px; }
.btn.primary { background: var(--crimson); color: #fff; box-shadow: 0 4px 0 var(--crimson-deep); }
#confetti { position: fixed; inset: 0; z-index: 950; pointer-events: none; }

@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
.cat { animation-name: catpop; }

const SCREENS = {};

/** Common activity frame: back button, title, step dots, spoken instruction. */
function activityShell(game, instrEn, instrEs, steps) {
  const dots = h('div', { class: 'progress', 'aria-label': 'Progreso' }, Array.from({ length: steps }, () => h('i')));
  const stage = h('section', { class: 'stage' });
  const instr = h('div', { class: 'instr' },
    h('div', { class: 'instr-num', 'aria-hidden': 'true' }, String(GAME_IDS.indexOf(game.id) + 1)),
    h('div', { class: 'instr-text' }, h('strong', { text: instrEn }), h('span', { text: instrEs })),
    h('button', { class: 'say-btn', type: 'button', 'aria-label': 'Escuchar instrucciones', onclick: async () => { await sayEs(instrEs); say(instrEn); } }, h('span', { class: 'emoji', text: '🔊' }))
  );
  const root = h('div', {},
    h('div', { class: 'act-head' },
      h('button', { class: 'back-btn', type: 'button', onclick: () => go('home') }, h('span', { 'aria-hidden': 'true', text: '←' }), 'Casa'),
      h('h1', { class: 'act-title', text: game.en }),
      dots),
    instr, stage);
  const setStep = i => [...dots.children].forEach((d, k) => { d.className = k < i ? 'done' : (k === i ? 'now' : ''); });
  setStep(0);
  return { root, stage, setStep };
}

function starsFromMistakes(m, total) {
  const ratio = m / Math.max(1, total);
  return ratio <= 0.15 ? 3 : ratio <= 0.45 ? 2 : 1;
}

function finish(game, stars) {
  const prev = State.stars[game.id];
  if (stars > prev) { State.stars[game.id] = stars; save(); }
  updateTop();
  Sfx.win();
  const praise = stars === 3 ? 'Excellent!' : stars === 2 ? 'Very good!' : 'Good job!';
  const esLine = stars === 3 ? '¡Perfecto! Ganaste 3 estrellas.' : stars === 2 ? '¡Muy bien! Juega otra vez para ganar 3.' : '¡Bien! Practica otra vez y lo harás mejor.';
  const card = h('div', { class: 'win-card', role: 'dialog', 'aria-modal': 'true', 'aria-label': praise },
    h('div', { class: 'big-stars' }, [1, 2, 3].map(i => h('span', { class: i <= stars ? '' : 'off', style: 'animation-delay:' + (i * 0.15) + 's', text: '⭐' }))),
    h('h2', { text: praise }),
    h('p', { style: 'margin:0', text: esLine }),
    h('div', { class: 'win-actions' },
      h('button', { class: 'btn primary', type: 'button', onclick: () => go(game.id) }, 'Jugar otra vez'),
      h('button', { class: 'btn', type: 'button', onclick: () => go('home') }, 'Volver a la casa')));
  const ov = h('div', { class: 'overlay' }, card);
  document.body.append(ov);
  card.querySelector('.btn.primary').focus();
  confetti();

}

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = h('canvas', { id: 'confetti', 'aria-hidden': 'true' }); document.body.append(c);
  const ctx = c.getContext('2d'); if (!ctx) { c.remove(); return; }
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ['#C42341', '#FFD25C', '#3E8FC6', '#6DBE6A', '#F7A9BD', '#9DC9F2'];
  const P = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: 4 + Math.random() * 6, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    for (const p of P) { p.x += p.vx; p.y += p.vy; p.vy += .05; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
    if (t - t0 < 2600) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

/* ---------- Generic choice engine (Listen and point / Quiz) ---------- */
function choiceGame(game, instrEn, instrEs, rounds) {
  const { root, stage, setStep } = activityShell(game, instrEn, instrEs, rounds.length);
  let i = 0, mistakes = 0, alive = true;
  teardown = () => { alive = false; };
  function render() {
    const r = rounds[i]; setStep(i);
    let locked = false, missed = false;
    const replay = () => r.speak();
    const prompt = h('div', { class: 'prompt-row' },
      r.visual || null,
      r.question ? h('div', { class: 'prompt-q', text: r.question }) : null,
      h('button', { class: 'listen-big', type: 'button', onclick: replay }, h('span', { class: 'emoji', 'aria-hidden': 'true', text: '🔊' }), 'Listen'));
    const opts = h('div', { class: 'options' }, r.options.map(o => {
      const word = h('span', { class: 'word' + (r.hideWords ? ' hidden' : ''), text: o.label });
      const b = h('button', { class: 'opt', type: 'button', 'aria-label': r.hideWords ? 'Opción' : o.label }, o.node, word);
      b.addEventListener('click', async () => {
        if (locked) return;
        if (o.correct) {
          locked = true; b.classList.add('right'); word.classList.remove('hidden'); Sfx.ok(); announce('¡Correcto!');
          await (o.after ? say(o.after) : say(o.label));
          await wait(500);
          if (!alive) return;
          i++; if (i < rounds.length) render(); else { setStep(rounds.length); finish(game, starsFromMistakes(mistakes, rounds.length)); }
        } else {
          if (!missed) mistakes++; missed = true;
          b.classList.add('wrong'); shake(b); Sfx.no(); announce('Intenta otra vez');
          setTimeout(() => { if (alive) b.classList.remove('wrong'); replay(); }, 650);
        }
      });
      return b;
    }));
    stage.replaceChildren(prompt, opts);
    setTimeout(() => { if (alive) replay(); }, 250);
  }
  render();
  return root;
}

function pointRound(kind) {
  if (kind === 'room') {
    const opts = sample(MAIN_ROOMS.concat(roomById('balcony'), roomById('garden')), 3); const t = opts[0];
    return { hideWords: true, speak: () => say(t.en), options: shuffle(opts).map(r => ({ node: roomPic(r, 2), label: r.en, correct: r === t, after: 'This is the ' + r.en + '.' })) };
  }
  if (kind === 'object') {
    const pool = OBJECTS.filter(o => !roomById(o.room).extra); const t = sample(pool, 1)[0];
    const others = sample(pool.filter(o => o.room !== t.room), 2);
    return { hideWords: true, speak: () => say(t.en), options: shuffle([t, ...others]).map(o => ({ node: pic(o), label: o.en, correct: o === t })) };
  }
  const pool = ACTIONS.filter(a => !roomById(a.room).extra); const t = sample(pool, 1)[0];
  const others = sample(pool.filter(a => a.room !== t.room), 2);
  return { hideWords: true, speak: () => say(t.en), options: shuffle([t, ...others]).map(a => ({ node: pic(a), label: a.en, correct: a === t, after: sentenceOf(a) })) };
}

/* ---------- DRAG & DROP: objects / actions into rooms ---------- */
function sortGame(game, instrEn, instrEs, itemsFor, sentenceFor, labelFor) {
  const rooms = sample(MAIN_ROOMS, 4);
  const items = shuffle(rooms.flatMap(r => itemsFor(r)));
  const { root, stage, setStep } = activityShell(game, instrEn, instrEs, items.length);
  let placed = 0, mistakes = 0, alive = true; const missedIds = new Set();
  teardown = () => { alive = false; };
  const tray = h('div', { class: 'tray', 'aria-label': 'Bandeja de tarjetas' });
  const zonesEl = h('div', { class: 'zones' });
  const zoneMap = new Map();
  const dnd = createDnD({
    onPick: item => { Sfx.pick(); say(labelFor(item._data)); },
    onDrop: (item, zone) => {
      const d = item._data;
      if (zone.dataset.zone === d.room) {
        Sfx.ok(); placed++; setStep(placed);
        item.remove();
        zoneMap.get(d.room).append(h('span', { class: 'placed' }, pic(d), labelFor(d)));
        say(sentenceFor(d));
        announce('¡Correcto!');
        if (!tray.querySelector('.drag-item')) {
          tray.replaceChildren(h('span', { class: 'tray-empty', text: '¡Listo! 🎉' }));
          setTimeout(() => { if (alive) finish(game, starsFromMistakes(mistakes, items.length)); }, 1800);
        }
        return true;
      }
      if (!missedIds.has(d.id)) { missedIds.add(d.id); mistakes++; }
      Sfx.no(); announce('Esa no es. Intenta otra vez.');
      say('No. Try again!');
      return false;
    }
  });
  rooms.forEach(r => {
    const itemsBox = h('div', { class: 'zone-items' });
    const z = h('div', { class: 'zone', style: '--wall: var(--room-' + r.id + ')', 'aria-label': r.en },
      h('div', { class: 'zone-head' }, h('span', { text: r.en })), itemsBox);
    zoneMap.set(r.id, itemsBox);
    dnd.addZone(z, r.id);
    zonesEl.append(z);
  });
  items.forEach(d => {
    const b = h('button', { 'aria-label': labelFor(d) }, pic(d), h('span', { class: 'lbl', text: labelFor(d) }));
    b._data = d; dnd.addItem(b); tray.append(b);
  });
  stage.append(h('p', { class: 'dnd-help', text: 'Arrastra la tarjeta a la habitación, o tócala y luego toca la habitación.' }), tray, zonesEl);
  return root;
}
SCREENS.objects = () => sortGame(GAMES.find(g => g.id === 'objects'), 'Drag and match.', 'Arrastra cada objeto a la habitación donde va.',
  r => sample(objsOf(r.id), 2), o => cap(theWord(o)) + ' in the ' + roomById(o.room).en + '.', o => o.en);

/* ---------- DRAG & DROP: complete sentences and words ---------- */
SCREENS.complete = () => {
  const game = GAMES.find(g => g.id === 'complete');
  const acts = sample(ACTIONS.filter(a => !roomById(a.room).extra), 3);
  const wordPool = MAIN_ROOMS.map(r => ({ word: r.en, item: r, isRoom: true }))
    .concat(OBJECTS.filter(o => !roomById(o.room).extra && /^[a-z]+$/.test(o.en) && o.en.length >= 3).map(o => ({ word: o.en, item: o })))
    .concat(PARTS.slice(0, 2).map(p => ({ word: p.en, item: p })));
  const words = sample(wordPool, 3);
  const rounds = shuffle(acts.map(a => ({ type: 'sentence', a })).concat(words.map(w => ({ type: 'letter', w }))));
  const { root, stage, setStep } = activityShell(game, 'Trace and complete.', 'Arrastra la palabra o la letra que falta al espacio vacío.', rounds.length);
  let i = 0, mistakes = 0, alive = true;
  teardown = () => { alive = false; };

  function next() { i++; if (i < rounds.length) render(); else { setStep(rounds.length); finish(game, starsFromMistakes(mistakes, rounds.length)); } }

  function render() {
    setStep(i); const r = rounds[i]; let missed = false, done = false;
    const tray = h('div', { class: 'tray' });
    if (r.type === 'sentence') {
      const room = roomById(r.a.room);
      const blank = h('span', { class: 'blank', 'aria-label': 'espacio vacío', text: '?' });
      const sentence = h('div', { class: 'sentence' }, h('span', { text: 'I ' + r.a.en + ' in the' }), blank, h('span', { text: '.' }));
      const choices = shuffle([room, ...sample(MAIN_ROOMS.filter(x => x !== room), 2)]);
      const dnd = createDnD({
        onPick: item => { Sfx.pick(); say(item._data.en); },
        onDrop: (item, zone) => {
          if (done) return false;
          if (item._data === room) {
            done = true; Sfx.ok(); item.remove(); blank.textContent = room.en; blank.classList.add('filled');
            tray.querySelectorAll('.drag-item').forEach(b => { b.disabled = true; });
            say(sentenceOf(r.a)).then(() => wait(700)).then(() => { if (alive) next(); });
            return true;
          }
          if (!missed) { missed = true; mistakes++; }
          Sfx.no(); say('No. Try again!'); return false;
        }
      });
      dnd.addZone(blank, 'blank');
      choices.forEach(c => { const b = h('button', { class: 'word', 'aria-label': c.en }, roomPic(c), h('span', { text: c.en })); b._data = c; dnd.addItem(b); tray.append(b); });
      stage.replaceChildren(
        h('div', { class: 'prompt-row' }, h('div', { class: 'prompt-pic' }, pic(r.a)),
          h('button', { class: 'listen-big', type: 'button', onclick: () => say('I ' + r.a.en + ' in the...') }, h('span', { class: 'emoji', 'aria-hidden': 'true', text: '🔊' }), 'Listen')),
        sentence, tray);
      setTimeout(() => { if (alive) say('I ' + r.a.en + ' in the...'); }, 250);
    } else {
      const word = r.w.word; const letters = [...word];
      const candidates = letters.map((ch, k) => ({ ch, k })).filter(x => /[a-z]/.test(x.ch));
      const gap = sample(candidates, 1)[0];
      const blank = h('span', { class: 'letter-box blank', 'aria-label': 'letra que falta', text: '' });
      const row = h('div', { class: 'letters', 'aria-label': 'Palabra con una letra que falta' }, letters.map((ch, k) => {
        if (k === gap.k) return blank;
        return h('span', { class: 'letter-box' + (ch === ' ' ? ' space' : ''), text: ch === ' ' ? '' : ch });
      }));
      const alphabet = 'abcdefghiklmnoprstuvwy'.split('').filter(c => c !== gap.ch);
      const choices = shuffle([gap.ch, ...sample(alphabet, 2)]);
      const dnd = createDnD({
        onPick: () => Sfx.pick(),
        onDrop: (item, zone) => {
          if (done) return false;
          if (item._data === gap.ch) {
            done = true; Sfx.ok(); item.remove(); blank.textContent = gap.ch; blank.classList.add('filled');
            tray.querySelectorAll('.drag-item').forEach(b => { b.disabled = true; });
            say(word).then(() => wait(700)).then(() => { if (alive) next(); });
            return true;
          }
          if (!missed) { missed = true; mistakes++; }
          Sfx.no(); say('No. Try again!'); return false;
        }
      });
      dnd.addZone(blank, 'blank');
      choices.forEach(c => { const b = h('button', { class: 'letter', 'aria-label': 'letra ' + c, text: c }); b._data = c; dnd.addItem(b); tray.append(b); });
      const visual = r.w.isRoom ? h('span', { style: 'display:inline-block;width:150px;max-width:100%;aspect-ratio:4/3;font-size:38px' }, roomPic(r.w.item, 2)) : h('div', { class: 'prompt-pic' }, pic(r.w.item));
      if (r.w.isRoom) { visual.firstChild.style.width = '100%'; visual.firstChild.style.height = '100%'; }
      stage.replaceChildren(
        h('div', { class: 'prompt-row' }, visual,
          h('button', { class: 'listen-big', type: 'button', onclick: () => say(word) }, h('span', { class: 'emoji', 'aria-hidden': 'true', text: '🔊' }), 'Listen')),
        row, tray);
      setTimeout(() => { if (alive) say(word); }, 250);
    }
  }
  render();
  return root;
};

/* ---------- WHERE'S CLOUD? ---------- */
SCREENS.cloud = () => {
  const game = GAMES.find(g => g.id === 'cloud');
  const N = 6; const targets = [];
  const pool = ROOMS.slice();
  while (targets.length < N) { const t = sample(pool, 1)[0]; if (t !== targets[targets.length - 1]) targets.push(t); }
  const { root, stage, setStep } = activityShell(game, "Where's Cloud?", 'Cloud es un gato que se esconde. Escucha dónde está y toca esa habitación.', N);
  let i = 0, mistakes = 0, alive = true;
  teardown = () => { alive = false; };
  function render() {
    setStep(i); const t = targets[i]; let locked = false, missed = false;
    const line = "Where's Cloud? Cloud is in the " + t.en + '.';
    const house = buildHouse({
      withDoor: false,
      onRoom: async (room, tile) => {
        if (locked) return;
        if (room === t) {
          locked = true; tile.classList.add('right'); tile.append(h('span', { class: 'cat', 'aria-hidden': 'true', text: '🐱' }));
          Sfx.ok(); announce('¡Encontraste a Cloud!');
          await say('Meow! Yes! Cloud is in the ' + t.en + '!');
          await wait(600); if (!alive) return;
          i++; if (i < N) render(); else { setStep(N); finish(game, starsFromMistakes(mistakes, N)); }
        } else {
          if (!missed) { missed = true; mistakes++; }
          shake(tile); Sfx.no();
          await say('No. Cloud is not in the ' + room.en + '.');
          if (alive && !locked) say('Cloud is in the ' + t.en + '.');
        }
      }
    });
    stage.replaceChildren(
      h('div', { class: 'prompt-row' },
        h('div', { class: 'prompt-q' }, h('span', { class: 'emoji', 'aria-hidden': 'true', text: '🐱 ' }), "Where's Cloud?"),
        h('button', { class: 'listen-big', type: 'button', onclick: () => say(line) }, h('span', { class: 'emoji', 'aria-hidden': 'true', text: '🔊' }), 'Listen')),
      house);
    setTimeout(() => { if (alive) say(line); }, 250);
  }
  render();
  return root;
};

/* =========================================================
   8. BOOT + hash routing
   ========================================================= */
function routeFromHash() { const n = location.hash.slice(1); go(n && SCREENS[n] ? n : 'home'); }
window.addEventListener('hashchange', routeFromHash);
routeFromHash();
